<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopbill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <h1>Stopbill</h1>
      <p class="muted">Free. Not affiliated with OpenAI.</p>
    </header>

    <main>
      <section aria-labelledby="service-title">
        <h2 id="service-title">Service: ChatGPT</h2>
        <fieldset>
          <legend>Where do you pay for ChatGPT?</legend>
          <div id="channels"></div>
        </fieldset>
      </section>

      <section id="flow" aria-live="polite"></section>
    </main>

    <footer class="foot">
      <p class="muted">Stopbill saves your checklist in this browser only. It does not read pages, store passwords, or send data anywhere.</p>
      <button type="button" id="reset" class="link">Start over</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
